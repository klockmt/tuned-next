[main]
summary=Extreme battery savings (survival mode)

[cpu]
governor=powersave
energy_performance_preference=power
boost=0

[sysctl]
kernel.nmi_watchdog=0
vm.dirty_writeback_centisecs=1500
vm.dirty_background_ratio=3
vm.dirty_ratio=10

[sysfs]
/sys/module/pcie_aspm/parameters/policy=powersave
/sys/module/nvme_core/parameters/default_ps_max_latency_us=15000

[scsi_host]
alpm=med_power_with_dipm

[net]
wifi_power_save=1