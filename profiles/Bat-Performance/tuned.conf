# /usr/lib/tuned/Bat-Performance/tuned.conf
[main]
summary=klockklock

[cpu]
governor=powersave
energy_perf_bias=balance_performance
boost=1

[sysctl]
kernel.nmi_watchdog=0
vm.dirty_writeback_centisecs=1500

[sysfs]
/sys/module/pcie_aspm/parameters/policy=default

[audio]
timeout=10

[usb]
autosuspend=10

[scsi_host]
alpm=med_power_with_dipm

[net]
wifi_power_save=0