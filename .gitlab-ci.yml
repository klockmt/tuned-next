image: archlinux:latest

stages:
  - build

build-arch-package:
  stage: build
  script:
    - pacman -Syu --noconfirm base-devel sudo git python
    - useradd -m builduser
    - 'echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers'
    - chown -R builduser:builduser .
    - sudo -u builduser makepkg -s --noconfirm
  artifacts:
    paths:
      - "*.pkg.tar.zst"
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG