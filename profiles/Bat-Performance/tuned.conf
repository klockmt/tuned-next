[main]
summary=High throughput on battery (VMs, compiling)

[cpu]
governor=schedutil
energy_performance_preference=balance_performance
boost=1

[sysctl]
kernel.nmi_watchdog=0
vm.dirty_writeback_centisecs=500
vm.dirty_background_ratio=3
vm.dirty_ratio=10

[sysfs]
/sys/module/pcie_aspm/parameters/policy=default
/sys/module/nvme_core/parameters/default_ps_max_latency_us=5000

[scsi_host]
alpm=med_power_with_dipm

[net]
wifi_power_save=0