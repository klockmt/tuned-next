# /usr/lib/tuned/Gaming-mode/tuned.conf
[main]
summary=Performance extrema focada em jogos. Baixissima latencia e otimizacoes para Steam/Proton.

[cpu]
governor=performance
energy_perf_bias=performance
boost=1
force_latency=1

[sysctl]
vm.max_map_count=2147483642
vm.compaction_proactiveness=0
net.ipv4.tcp_fastopen=3

[video]
radeon_powersave=dpm-perf

[sysfs]
/sys/module/pcie_aspm/parameters/policy=performance

[audio]
timeout=0

[usb]
autosuspend=0

[scsi_host]
alpm=max_performance

[net]
wifi_power_save=0