[main]
summary=Optimized for heavy software compilation

[cpu]
governor=performance
energy_performance_preference=performance
boost=1

[sysctl]
vm.dirty_background_ratio=3
vm.dirty_ratio=10
vm.swappiness=10
vm.dirty_writeback_centisecs=500

[sysfs]
/sys/module/pcie_aspm/parameters/policy=performance
/sys/module/nvme_core/parameters/default_ps_max_latency_us=0

[scsi_host]
alpm=max_performance

[net]
wifi_power_save=0