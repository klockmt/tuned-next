# /usr/lib/tuned/Bat-Balanced/tuned.conf
[main]
summary=Daily use on battery (browsing, coding)

[cpu]
governor=powersave
energy_perf_bias=balance_power
boost=1

[sysctl]
kernel.nmi_watchdog=0
vm.dirty_writeback_centisecs=3000

[sysfs]
/sys/module/pcie_aspm/parameters/policy=balanced

[audio]
timeout=5

[usb]
autosuspend=5

[scsi_host]
alpm=med_power_with_dipm

[net]
wifi_power_save=0