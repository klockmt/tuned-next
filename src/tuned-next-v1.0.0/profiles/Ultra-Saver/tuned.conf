# /usr/lib/tuned/Ultra-Saver/tuned.conf
[main]
summary=

[cpu]
governor=powersave
energy_perf_bias=power
boost=0

[sysctl]
kernel.nmi_watchdog=0
vm.dirty_writeback_centisecs=6000

[sysfs]
/sys/module/pcie_aspm/parameters/policy=powersupersave

[audio]
timeout=1

[usb]
autosuspend=1

[scsi_host]
alpm=min_power